<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Motor Racing 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#70c9e8;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#70c9e8 0%,#a9e1ef 48%,#23852c 49%,#176c22 100%);
}

/* SUN */
#sun{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#fff3a0;
  top:8%;
  right:10%;
  box-shadow:0 0 35px #fff3a0;
}

/* MOUNTAINS */
.mountain{
  position:absolute;
  bottom:45%;
  width:0;
  height:0;
  border-left:110px solid transparent;
  border-right:110px solid transparent;
  border-bottom:140px solid #527c80;
}

.m1{left:5%}
.m2{left:28%;transform:scale(1.4)}
.m3{right:8%;transform:scale(1.2)}

/* ROAD */
#road{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  height:55%;
  background:#292929;
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);
  overflow:hidden;
}

/* ROAD ED
bike.add(body);


// SEAT
const seatGeometry = new THREE.BoxGeometry(0.65,0.2,0.8);

const seatMaterial = new THREE.MeshStandardMaterial({
  color: 0x111111
});

const seat = new THREE.Mesh(
  seatGeometry,
  seatMaterial
);

seat.position.set(0,1.05,0.2);

bike.add(seat);


// WHEELS
function createWheel(z){

  const geometry = new THREE.CylinderGeometry(
    0.45,
    0.45,
    0.25,
    32
  );

  const material = new THREE.MeshStandardMaterial({
    color: 0x111111
  });

  const wheel = new THREE.Mesh(
    geometry,
    material
  );

  wheel.rotation.z = Math.PI / 2;
  wheel.position.set(0,0.45,z);

  bike.add(wheel);
}

createWheel(0.8);
createWheel(-0.8);


// HANDLEBAR
const handleGeometry = new THREE.BoxGeometry(
  1.2,
  0.12,
  0.12
);

const handleMaterial = new THREE.MeshStandardMaterial({
  color: 0x222222
});

const handle = new THREE.Mesh(
  handleGeometry,
  handleMaterial
);

handle.position.set(0,1.25,-0.8);

bike.add(handle);


bike.position.set(0,0,5);

scene.add(bike);


// CAMERA
camera.position.set(0,4,10);
camera.lookAt(bike.position);


// GAME VARIABLES
let speed = 0;
let acceleration = 0;
let steering = 0;


// BUTTONS
const left = document.getElementById("left");
const right = document.getElementById("right");
const gas = document.getElementById("gas");


left.addEventListener("touchstart", e => {
  e.preventDefault();
  steering = -1;
});

left.addEventListener("touchend", e => {
  e.preventDefault();
  steering = 0;
});


right.addEventListener("touchstart", e => {
  e.preventDefault();
  steering = 1;
});

right.addEventListener("touchend", e => {
  e.preventDefault();
  steering = 0;
});


gas.addEventListener("touchstart", e => {
  e.preventDefault();
  acceleration = 0.02;
});

gas.addEventListener("touchend", e => {
  e.preventDefault();
  acceleration = 0;
});


// KEYBOARD
document.addEventListener("keydown", e => {

  if(e.key === "ArrowLeft")
    steering = -1;

  if(e.key === "ArrowRight")
    steering = 1;

  if(e.key === "ArrowUp")
    acceleration = 0.02;
});


document.addEventListener("keyup", e => {

  if(e.key === "ArrowLeft" || e.key === "ArrowRight")
    steering = 0;

  if(e.key === "ArrowUp")
    acceleration = 0;
});


// GAME LOOP
function animate(){

  requestAnimationFrame(animate);

  speed += acceleration;

  speed *= 0.98;

  if(speed > 1)
    speed = 1;

  if(speed < 0)
    speed = 0;


  bike.position.z -= speed;


  bike.position.x += steering * speed * 0.15;


  // Keep bike on road
  if(bike.position.x > 5)
    bike.position.x = 5;

  if(bike.position.x < -5)
    bike.position.x = -5;


  // Lean motorcycle
  bike.rotation.z = -steering * 0.25;


  // Camera follows
  camera.position.x +=
    (bike.position.x - camera.position.x) * 0.08;

  camera.position.z =
    bike.position.z + 8;

  camera.lookAt(
    bike.position.x,
    0.7,
    bike.position.z - 8
  );


  document.getElementById("speed").innerText =
    "SPEED: " + Math.floor(speed * 200);


  renderer.render(scene,camera);
}


animate();


// RESIZE
window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
